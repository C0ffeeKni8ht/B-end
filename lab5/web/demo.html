<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Демонстрація JSON API — Assembler</title>
    <style>
        body { background: #ffffff; color: #000000; font-family: monospace; margin: 8px; }
        label, h2 { font-family: sans-serif; font-size: 14px; }
        h2 { margin: 20px 0 0; }
        a { color: #8ab4f8; }
        pre { font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
<label>
    Структурний текст програми
    <input type="checkbox" id="pretty" checked>
</label>

<div id="sections"></div>

<script>
    const endpoints = [
        { title: 'Element',           url: 'api/elements' },
        { title: 'Parameters',        url: 'api/parameters' },
        { title: 'ElementParameters', url: 'api/element-parameters' },
    ];

    const data = {};
    const outputs = {};

    function render() {
        const pretty = document.getElementById('pretty').checked;
        endpoints.forEach(ep => {
            if (data[ep.url] !== undefined) {
                outputs[ep.url].textContent = JSON.stringify(data[ep.url], null, pretty ? 2 : 0);
            }
        });
    }

    endpoints.forEach(ep => {
        const h2 = document.createElement('h2');
        const link = document.createElement('a');
        link.href = ep.url;
        link.textContent = ep.title + '  (/' + ep.url + ')';
        h2.appendChild(link);
        const pre = document.createElement('pre');
        pre.textContent = 'Завантаження...';
        document.getElementById('sections').append(h2, pre);
        outputs[ep.url] = pre;

        fetch(ep.url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Сервер відповів кодом ' + response.status);
                }
                return response.json();
            })
            .then(json => {
                data[ep.url] = json;
                render();
            })
            .catch(error => {
                pre.textContent = 'Помилка завантаження даних';
                console.error(error);
            });
    });

    document.getElementById('pretty').addEventListener('change', render);
</script>
</body>
</html>
